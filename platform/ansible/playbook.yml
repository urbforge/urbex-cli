---
- name: Configure all urbex base-service containers
  hosts: all
  become: true
  roles:
    - common

# First: every LXC resolves through Technitium (ADR-0027), falling back
# to its forwarders until it answers.
- name: Deploy Technitium DNS
  hosts: urbex_technitium
  become: true
  roles:
    - technitium

# Then every other base service at once, each on its LXC (redemptor#18):
# they don't depend on each other. "free" lets each host run its own role
# at its own pace instead of in lockstep.
- name: Deploy the other base services in parallel
  hosts: all:!urbex_technitium
  become: true
  strategy: free
  tasks:
    # The images of the Stack Komodo deploys here once Komodo is up
    # (Keycloak, the observability stack, the tunnel): pulled now, while
    # Gitea and Komodo install, so that the deploy only starts them
    # (urbforge/urbex-cli#30).
    - name: Pull the images of this LXC's Stack
      command: docker pull --quiet {{ item }}
      loop: "{{ urbex_images | default([]) }}"
      changed_when: false
      # One LXC at a time: the node's disk is shared, and Gitea's and
      # Komodo's first starts are slowed by every concurrent write.
      throttle: 1

    - name: Deploy this LXC's service
      include_role:
        # Gitea and Komodo; Keycloak's, the observability stack's and the
        # tunnel's roles only clean up - Komodo deploys them (ADR-0027).
        name: "{{ {'tunnel': 'cloudflared'}.get(urbex_service, urbex_service) }}"

- name: Send every base service's logs and resource metrics to the observability stack
  hosts: all
  become: true
  roles:
    - telemetry
