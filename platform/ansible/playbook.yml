---
- name: Configure all urbex base-service containers
  hosts: all
  become: true
  roles:
    - common

# First: every LXC resolves through Technitium (ADR-0027), falling back
# to its forwarders until it answers.
- name: Deploy Technitium DNS
  hosts: urbex_technitium
  become: true
  roles:
    - technitium

- name: Deploy Gitea
  hosts: urbex_gitea
  become: true
  roles:
    - gitea

- name: Deploy Komodo
  hosts: urbex_komodo
  become: true
  roles:
    - komodo

- name: Keycloak - deployed by Komodo from the GitOps repo; clean up what Ansible ran it from
  hosts: urbex_keycloak
  become: true
  roles:
    - keycloak

- name: The observability stack - deployed by Komodo from the GitOps repo; clean up
  hosts: urbex_observability
  become: true
  roles:
    - observability

- name: The Cloudflare Tunnel connector - deployed by Komodo from the GitOps repo; clean up
  hosts: urbex_tunnel
  become: true
  roles:
    - cloudflared

- name: Send every base service's logs and resource metrics to the observability stack
  hosts: all
  become: true
  roles:
    - telemetry
