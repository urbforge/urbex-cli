---
- name: Configure all urbex base-service containers
  hosts: all
  become: true
  roles:
    - common

- name: Deploy Gitea
  hosts: urbex_gitea
  become: true
  roles:
    - gitea

- name: Deploy Komodo
  hosts: urbex_komodo
  become: true
  roles:
    - komodo

- name: Deploy Technitium DNS
  hosts: urbex_technitium
  become: true
  roles:
    - technitium

- name: Deploy Keycloak
  hosts: urbex_keycloak
  become: true
  roles:
    - keycloak

- name: Deploy the observability stack (Prometheus, Grafana, Loki)
  hosts: urbex_observability
  become: true
  roles:
    - observability

- name: Deploy the Cloudflare Tunnel connector
  hosts: urbex_tunnel
  become: true
  roles:
    - cloudflared

- name: Send every base service's logs and resource metrics to the observability stack
  hosts: all
  become: true
  roles:
    - telemetry
