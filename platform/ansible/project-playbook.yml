---
# Configures the per-service LXCs of a single project+environment: Docker
# and the Komodo Periphery agent. The project's own containers are not
# Ansible's business - Komodo rolls them out through Periphery. See
# docs/decisions/0019-branch-environments-komodo-rollouts.md in
# urbforge/urbex. Run with an inventory generated by urbex apply for one
# project+env - never against the base-service inventory (use
# playbook.yml for that, via urbex bootstrap).
- name: Configure project-service containers
  hosts: all
  become: true
  roles:
    - common

- name: Connect them to Komodo
  hosts: all
  become: true
  roles:
    - periphery
