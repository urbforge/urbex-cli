---
# Configures the per-service LXCs of a single project+environment. See
# docs/decisions/0002-app-manifest-in-app-repo.md and
# docs/manifest-spec.md in urbforge/urbex. Run with an inventory
# generated by urbex plan/apply for one project+env - never against the
# base-service inventory (use playbook.yml for that, via urbex
# bootstrap).
- name: Configure project-service containers
  hosts: all
  become: true
  roles:
    - common

- name: Deploy service containers
  hosts: all
  become: true
  roles:
    - service
