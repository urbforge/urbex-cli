---
# Keycloak is a Komodo Stack deployed from the GitOps repo
# (platform/, ADR-0027), no longer by Ansible. On a platform Ansible
# set up before, this removes the files it ran from - the running
# containers are left to the Stack, which takes them over (same compose
# project, "urbex", same volumes) when Komodo deploys it.
- name: Remove the files Ansible deployed Keycloak from
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/urbex/docker-compose.yml
