---
# What urbex's VM template needs on top of the LXC template's roles
# (ADR-0033): the QEMU guest agent, through which Proxmox shuts the VM
# down cleanly and reads its addresses, and a cloud-init that runs again
# on each clone, which Proxmox gives its own address and SSH key.
- name: Install the QEMU guest agent
  apt:
    name: qemu-guest-agent
    state: present
    update_cache: true

- name: Start it
  systemd:
    name: qemu-guest-agent
    state: started

# Last: each clone is a new instance for cloud-init, which then sets its
# network, its SSH host keys and root's key again.
- name: Forget this instance in cloud-init
  command: cloud-init clean --logs
  changed_when: true
