---
# Installs Docker Engine + the compose plugin on a fresh Debian 13 LXC,
# per docs/decisions/0003-terraform-ansible-provisioning.md in
# urbforge/urbex.

- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian # needed by deb822_repository
    state: present
    update_cache: true

- name: Add the Docker apt repository
  deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    signed_by: https://download.docker.com/linux/debian/gpg

- name: Install Docker Engine and the Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Create /opt/urbex for this host's docker compose project
  file:
    path: /opt/urbex
    state: directory
    mode: "0750"

# Gitea's container registry is plain HTTP until ingress/TLS exists
# (docs/decisions/0018-image-build-komodo-gitea-registry.md in
# urbforge/urbex), so Docker must be told to trust it explicitly.
- name: Trust the Gitea container registry over HTTP
  copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'insecure-registries': [gitea_registry]} | to_nice_json }}\n"
    mode: "0644"
  register: docker_daemon_json
  when: gitea_registry | default('') | length > 0

- name: Restart Docker to pick up the registry configuration
  systemd:
    name: docker
    state: restarted
  when: docker_daemon_json is changed
