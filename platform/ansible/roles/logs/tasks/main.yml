---
# Ships the logs of this LXC's service to the platform's Loki, with Grafana
# Alloy reading the containers' logs from Docker. Labels: project,
# service, env, host - so a query like {project="acme-app", env="prod"}
# finds them in Grafana. Off when the manifest says observability.logs:
# false. See docs/decisions/0023-service-logs-to-loki.md in urbforge/urbex.
- name: Create the log agent's directory
  file:
    path: /opt/urbex/logs
    state: directory
    mode: "0755"
  when: urbex_logs | bool

- name: Template the log agent's configuration
  template:
    src: config.alloy.j2
    dest: /opt/urbex/logs/config.alloy
    mode: "0644"
  register: alloy_config
  when: urbex_logs | bool

- name: Template the log agent's docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/urbex/logs/docker-compose.yml
    mode: "0644"
  when: urbex_logs | bool

- name: Start the log agent
  command: docker compose up -d
  args:
    chdir: /opt/urbex/logs
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"
  when: urbex_logs | bool

# compose up doesn't notice a changed bind-mounted file.
- name: Restart the log agent on a new configuration
  command: docker compose restart alloy
  args:
    chdir: /opt/urbex/logs
  when: urbex_logs | bool and alloy_config is changed

- name: Stop the log agent when logs are off
  shell: |
    if [ -f /opt/urbex/logs/docker-compose.yml ]; then
      cd /opt/urbex/logs && docker compose down && rm -f docker-compose.yml config.alloy && echo stopped
    fi
  register: logs_off
  changed_when: "'stopped' in logs_off.stdout"
  when: not (urbex_logs | bool)
