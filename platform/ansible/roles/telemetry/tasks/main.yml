---
# The telemetry agent of every LXC - base services and project services:
# Grafana Alloy, sending the LXC's resource metrics (CPU, memory, disk,
# network) to the platform's Prometheus and its service's container logs
# to Loki. Everything is labelled kind="platform" (Gitea, Komodo, ...) or
# kind="app" (a project's service), with the service, the host and, for
# apps, the project and environment. Logs are off for a project whose
# manifest says observability.logs: false. See
# docs/decisions/0023-service-logs-to-loki.md in urbforge/urbex.
- name: Create the telemetry agent's directory
  file:
    path: /opt/urbex/telemetry
    state: directory
    mode: "0755"

- name: Template the telemetry agent's configuration
  template:
    src: config.alloy.j2
    dest: /opt/urbex/telemetry/config.alloy
    mode: "0644"
  register: alloy_config

- name: Template the telemetry agent's docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/urbex/telemetry/docker-compose.yml
    mode: "0644"

- name: Start the telemetry agent
  command: docker compose up -d
  args:
    chdir: /opt/urbex/telemetry
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

# compose up doesn't notice a changed bind-mounted file.
- name: Restart the telemetry agent on a new configuration
  command: docker compose restart alloy
  args:
    chdir: /opt/urbex/telemetry
  when: alloy_config is changed

# The agent of earlier versions (logs only), replaced by this one.
- name: Remove the previous log agent
  shell: |
    if [ -f /opt/urbex/logs/docker-compose.yml ]; then
      cd /opt/urbex/logs && docker compose down && cd / && rm -rf /opt/urbex/logs && echo removed
    fi
  register: old_agent
  changed_when: "'removed' in old_agent.stdout"
