---
# The telemetry agent is a Komodo Stack per LXC, urbex-telemetry-<host>,
# deployed from the GitOps repo (platform/telemetry/<host>/, ADR-0027),
# no longer by Ansible. On an LXC Ansible set it up on before, this
# removes the files it ran from - the running agent is left to the Stack,
# which takes it over (compose project "telemetry", same volume) when
# Komodo deploys it. Also the agent of earlier versions (logs only).
- name: Remove the files Ansible deployed the telemetry agent from
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/urbex/telemetry
    - /opt/urbex/logs
