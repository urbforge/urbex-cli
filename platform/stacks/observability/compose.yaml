# Generated by urbex bootstrap from urbex-cli's platform/stacks - do not edit:
# changes are overwritten. Deployed by Komodo as the Stack urbex-observability,
# like a project service (ADR-0027): configuration in config.env, secrets in
# secrets.sops.env, decrypted on the LXC at deploy time.
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    labels:
      urbex.kind: "platform"
      urbex.service: "prometheus"
    restart: unless-stopped
    # Only for URBEX_STACK_FILES: a changed prometheus.yml recreates it.
    env_file:
      - config.env
    # The LXCs' telemetry agents push their metrics (remote write).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # The Proxmox node's CPU, memory and storages (urbforge/urbex-cli#94),
  # with a read-only token: only with the profile pve, which urbex turns
  # on in the Stack's environment when the token is in the credentials.
  # It reaches the node as pve-node (its address, from the same
  # environment), and Prometheus finds it by name in the Stack's network.
  pve-exporter:
    image: docker.io/prompve/prometheus-pve-exporter:3.12.0@sha256:3541b1f79fdf73200f73ce4863658ae7094a417e6827bd6ea90425c89d61ac12
    profiles: ["pve"]
    labels:
      urbex.kind: "platform"
      urbex.service: "pve-exporter"
    restart: unless-stopped
    # PVE_USER, PVE_TOKEN_NAME, PVE_TOKEN_VALUE are secrets; PVE_VERIFY_SSL
    # is in config.env.
    env_file:
      - config.env
      - path: ${URBEX_SECRETS_FILE:-secrets.env}
        required: false
    extra_hosts:
      - "pve-node:${URBEX_PVE_NODE_IP:-127.0.0.1}"

  loki:
    image: docker.io/grafana/loki:3.7.8
    labels:
      urbex.kind: "platform"
      urbex.service: "loki"
    restart: unless-stopped
    # The image's configuration, with no wait before /ready says ready: a
    # single Loki has no other ingester to give time to, and the wait only
    # starts at the first /ready, so a one-off check always got 503
    # (urbforge/urbex-cli#69). The image has no shell for a healthcheck.
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -ingester.min-ready-duration=0s
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    labels:
      urbex.kind: "platform"
      urbex.service: "grafana"
    restart: unless-stopped
    # GF_SECURITY_ADMIN_PASSWORD is a secret. URBEX_STACK_FILES, in
    # config.env, recreates it when its provisioning changes.
    env_file:
      - config.env
      - path: ${URBEX_SECRETS_FILE:-secrets.env}
        required: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
