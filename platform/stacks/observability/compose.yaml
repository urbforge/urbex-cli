# Generated by urbex bootstrap from urbex-cli's platform/stacks - do not edit:
# changes are overwritten. Deployed by Komodo as the Stack urbex-observability,
# like a project service (ADR-0027): configuration in config.env, secrets in
# secrets.sops.env, decrypted on the LXC at deploy time.
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    labels:
      urbex.kind: "platform"
      urbex.service: "prometheus"
    restart: unless-stopped
    # The LXCs' telemetry agents push their metrics (remote write).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: docker.io/grafana/loki:3.7.8
    labels:
      urbex.kind: "platform"
      urbex.service: "loki"
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    labels:
      urbex.kind: "platform"
      urbex.service: "grafana"
    restart: unless-stopped
    # GF_SECURITY_ADMIN_PASSWORD is a secret.
    env_file:
      - config.env
      - path: ${URBEX_SECRETS_FILE:-secrets.env}
        required: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
