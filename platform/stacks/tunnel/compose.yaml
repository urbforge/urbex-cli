# Generated by urbex bootstrap from urbex-cli's platform/stacks - do not edit:
# changes are overwritten. Deployed by Komodo as the Stack urbex-tunnel, like a
# project service (ADR-0027): configuration in config.env, secrets in
# secrets.sops.env, decrypted on the LXC at deploy time.
services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.9.3
    labels:
      urbex.kind: "platform"
      urbex.service: "tunnel"
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN, the connector's token, is a secret.
    env_file:
      - config.env
      - path: ${URBEX_SECRETS_FILE:-secrets.env}
        required: false
