# Generated by urbex bootstrap from urbex-cli's platform/stacks - do not edit:
# changes are overwritten. Deployed by Komodo as the Stack urbex-build-cache,
# on Komodo's LXC, its builder (urbforge/urbex-cli#92).
#
# Every KEEP_EVERY seconds, it prunes what builds leave on the builder's
# disk: BuildKit's cache older than KEEP_FOR, then beyond KEEP_STORAGE
# (least recently used first), and images
# no container uses that are older than KEEP_FOR - the images of a
# release live in the registry, and the cache of an unchanged app stays.
# Each run's lines go to Loki, like every container's.
services:
  prune:
    image: docker.io/library/docker:29.9.3-cli
    labels:
      urbex.kind: "platform"
      urbex.service: "build-cache"
    restart: unless-stopped
    env_file:
      - config.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        sleep 600 # the first run after the builder settles
        while :; do
          before=$$(docker system df --format '{{.Type}} {{.Size}}' | tr '\n' ' ')
          # Two passes: what is older than KEEP_FOR, then what is least
          # recently used until the cache is under KEEP_STORAGE (the two
          # options together would only prune the old).
          old=$$(docker builder prune --force --filter "until=$$KEEP_FOR" 2>&1 | tail -n 1)
          size=$$(docker builder prune --force --keep-storage "$$KEEP_STORAGE" 2>&1 | tail -n 1)
          freed="older than $$KEEP_FOR: $$old, beyond $$KEEP_STORAGE: $$size"
          images=$$(docker image prune --all --force --filter "until=$$KEEP_FOR" 2>&1 | tail -n 1)
          after=$$(docker system df --format '{{.Type}} {{.Size}}' | tr '\n' ' ')
          echo "urbex build-cache: build cache: $$freed; images: $$images; before: $$before; after: $$after"
          sleep "$$KEEP_EVERY"
        done
