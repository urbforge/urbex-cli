# Two applications on one machine (an LXC group, ADR-0037) and a third on
# its own: each keeps its Stack, its internal name and its healthcheck;
# the group is one LXC, one Komodo Server, one telemetry agent.
apiVersion: urbex/v1
project: box
environments: [prod]
services:
  - name: web
    image: docker.io/library/nginx
    version: "1.29"
    port: 80
    lxc: pair
  - name: who
    image: docker.io/traefik/whoami
    version: "v1.12"
    port: 8081
    lxc: pair
    env:
      prod:
        WHOAMI_PORT_NUMBER: "8081"
  - name: solo
    image: docker.io/library/caddy
    version: "2.10"
    port: 80
