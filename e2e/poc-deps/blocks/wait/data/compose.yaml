# Block "data": a PostgreSQL and a Redis. They don't depend on each other.
# PostgreSQL starts slowly on purpose (20 s before initdb, then initdb), so
# that "the container runs" and "it can take calls" are far apart: its
# temporary initdb server listens only on the Unix socket, so nothing
# answers on TCP until the real server starts.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: poc
    command:
      - sh
      - -c
      - 'echo "$$(date +%s) postgres start"; sleep 20; exec docker-entrypoint.sh postgres'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [pocnet]

  cache:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [pocnet]

networks:
  pocnet:
    external: true
