# Block "web", with a wait service for the api of block "api" and the cache of
# block "data" (a diamond with the chain data, api, web).
services:
  wait:
    image: docker.io/library/busybox:1.37
    restart: "no"
    command:
      - sh
      - -c
      - 'echo "$$(date +%s) wait start"; i=0; until wget -q -O /dev/null http://api:8080/ && nc -w 2 cache 6379 </dev/null; do i=$$((i+1)); if [ $$i -ge 120 ]; then echo "$$(date +%s) wait: gave up waiting for api and cache"; exit 1; fi; sleep 2; done; echo "$$(date +%s) wait done"'
    networks: [pocnet]

  assets:
    image: docker.io/library/busybox:1.37
    restart: unless-stopped
    depends_on:
      wait:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - 'mkdir -p /www; echo ok >/www/index.html; exec httpd -f -p 8080 -h /www'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [pocnet]

  web:
    image: docker.io/library/busybox:1.37
    restart: unless-stopped
    depends_on:
      assets:
        condition: service_healthy
    command:
      - sh
      - -c
      - 'echo "$$(date +%s) web start"; wget -q -O /dev/null http://api:8080/ || { echo "$$(date +%s) web: api missing"; exit 1; }; nc -w 2 cache 6379 </dev/null || { echo "$$(date +%s) web: cache missing"; exit 1; }; mkdir -p /www; echo ok >/www/index.html; echo "$$(date +%s) web serving"; exec httpd -f -p 8081 -h /www'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [pocnet]

networks:
  pocnet:
    external: true
