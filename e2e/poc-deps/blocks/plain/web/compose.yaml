# Block "web": a static server and the web, which needs the api of block "api"
# and the cache of block "data" (a diamond with the chain data, api, web).
services:
  assets:
    image: docker.io/library/busybox:1.37
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'mkdir -p /www; echo ok >/www/index.html; exec httpd -f -p 8080 -h /www'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [pocnet]

  web:
    image: docker.io/library/busybox:1.37
    restart: unless-stopped
    depends_on:
      assets:
        condition: service_healthy
    command:
      - sh
      - -c
      - 'echo "$$(date +%s) web start"; wget -q -O /dev/null http://api:8080/ || { echo "$$(date +%s) web: api missing"; exit 1; }; nc -w 2 cache 6379 </dev/null || { echo "$$(date +%s) web: cache missing"; exit 1; }; mkdir -p /www; echo ok >/www/index.html; echo "$$(date +%s) web serving"; exec httpd -f -p 8081 -h /www'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [pocnet]

networks:
  pocnet:
    external: true
