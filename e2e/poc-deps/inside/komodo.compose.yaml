# Komodo Core, its database and a Periphery agent, as urbex bootstrap
# deploys them (platform/ansible/roles/komodo/templates/docker-compose.yml.j2),
# with Periphery also on the network the PoC's blocks share (pocnet), so that
# the commands Komodo runs for a Stack can reach them by name.
services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.106.0-ferretdb-2.5.0
    labels:
      komodo.skip:
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.5.0
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/moghtech/komodo-core:${KOMODO_VERSION}
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      - "9120:9120"
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
    volumes:
      - keys:/config/keys
      - /etc/komodo/backups:/backups

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${KOMODO_VERSION}
    container_name: poc-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    env_file: ./compose.env
    networks:
      - default
      - pocnet
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo

networks:
  pocnet:
    external: true

volumes:
  postgres-data:
  ferretdb-state:
  keys:
