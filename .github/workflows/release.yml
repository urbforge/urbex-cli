# The release: on a v* tag (pushed by Teg - a tag publishes), the tests,
# then GoReleaser (.goreleaser.yaml) builds the binaries and archives and
# drafts the GitHub release, then the release is published: as a
# pre-release while urbex is 0.x or the tag has a suffix (v0.1.0-rc.1).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go deno
      - run: mise run lint
      - run: mise run test

  release:
    needs: test
    if: github.repository == 'urbforge/urbex-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the release and its assets
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog since the previous tag
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go goreleaser
      - name: Build and draft the release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v0.* | *-*) pre=true ;;
            *) pre=false ;;
          esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$pre"
